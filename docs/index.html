<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="社会学チューブ">
<title>社会学チューブ</title>
<style>
:root{
  --bg:#fcfcfb;--card:#ffffff;--ink:#0b0b0b;--ink2:#52514e;--ink3:#7a7974;--line:#e1e0d9;
  --accent:#2a78d6;--accent-soft:#e6f0fb;--up:#006300;--chip:#f0efec;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1a1a19;--card:#232322;--ink:#f0efec;--ink2:#c3c2b7;--ink3:#8f8e87;--line:#2c2c2a;
  --accent:#3987e5;--accent-soft:#1f2b3a;--up:#0ca30c;--chip:#2c2c2a;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 12px) 16px 8px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0}
.meta{font-size:12px;color:var(--ink3);margin-top:2px}
main{padding:12px 16px calc(84px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.filters{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:999px;
  padding:6px 12px;font-size:13px;font-family:inherit;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select.chip{appearance:none;-webkit-appearance:none;padding-right:26px;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);
  background-position:right 13px center,right 8px center;background-size:5px 5px;background-repeat:no-repeat}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.vtop{display:flex;gap:10px;align-items:flex-start}
.rank{flex:none;width:26px;height:26px;border-radius:8px;background:var(--chip);color:var(--ink2);font-weight:700;
  font-size:13px;display:flex;align-items:center;justify-content:center}
.rank.hi{background:var(--accent);color:#fff}
.vtitle{font-weight:600;color:var(--ink);text-decoration:none;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sub{font-size:12px;color:var(--ink3);margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-size:11px;background:var(--chip);color:var(--ink2);border-radius:6px;padding:1px 7px}
.tag.news{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tag.k{background:transparent;border:1px solid var(--line)}
.lead{font-size:13px;color:var(--ink2);margin:0 0 8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.stat .k{font-size:11px;color:var(--ink3)}
.stat .v{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .v.up{color:var(--up)}
.spark{margin-top:8px;position:relative}
.spark svg{display:block;width:100%;height:44px;overflow:visible}
.dot{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--card);transform:translate(-50%,-50%);pointer-events:none}
.tip{position:absolute;top:-6px;transform:translate(-50%,-100%);background:var(--ink);color:var(--bg);font-size:11px;
  padding:3px 7px;border-radius:6px;white-space:nowrap;pointer-events:none;display:none}
.note{font-size:12px;color:var(--ink3);background:var(--chip);border-radius:10px;padding:8px 10px;margin-bottom:10px}
.empty{color:var(--ink3);text-align:center;padding:40px 0}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--ink3);font:inherit;font-size:12px;padding:8px 0 10px;cursor:pointer}
nav button .ic{display:block;font-size:20px;line-height:1.2}
nav button[aria-current=page]{color:var(--accent);font-weight:700}
h2{font-size:15px;margin:6px 0 8px}
.bars .row{display:grid;grid-template-columns:9em 1fr;gap:8px;align-items:center;padding:6px 0;cursor:pointer;border-radius:8px}
.bars .row:active,.bars .row.sel{background:var(--accent-soft)}
.bars .name{font-size:12.5px;color:var(--ink2);text-align:right}
.bars .track{position:relative;height:22px}
.bars .bar{position:absolute;left:0;top:3px;height:16px;background:var(--accent);border-radius:0 4px 4px 0;min-width:2px}
.bars .val{position:absolute;top:1px;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:6px}
table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--ink3);font-weight:500}
.detail{font-size:13px;color:var(--ink2)}
.detail b{color:var(--ink)}
.ch{display:flex;gap:10px;align-items:center}
.ch img,.ch .ph{flex:none;width:36px;height:36px;border-radius:50%;background:var(--chip)}
.ch .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch a{color:inherit;text-decoration:none}
details summary{cursor:pointer;color:var(--ink2);font-size:13px;padding:4px 0}
footer{font-size:11px;color:var(--ink3);margin-top:16px}
</style>
</head>
<body>
<header>
  <h1 id="htitle">今日伸びた動画</h1>
  <div class="meta" id="meta">読み込み中…</div>
</header>
<main>
  <section id="tab-today"></section>
  <section id="tab-channels" hidden></section>
  <section id="tab-fields" hidden></section>
  <section id="tab-book" hidden></section>
  <footer>
    データ：YouTube Data API。登録者数はYouTubeの仕様で上3桁に丸められた値です（例：12.3万人）。
    分野・語り口・煽りは、タイトルと説明文の言葉から自動で判定しています（1本が複数に入ることがあります）。3分以下の動画（ショート）は除外しています。
  </footer>
</main>
<nav>
  <button data-tab="today" aria-current="page"><span class="ic">📈</span>今日</button>
  <button data-tab="channels"><span class="ic">👥</span>チャンネル</button>
  <button data-tab="fields"><span class="ic">🧭</span>分野</button>
  <button data-tab="book"><span class="ic">📖</span>本に近い</button>
</nav>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = n => {
  if (n == null) return "—";
  const a = Math.abs(n);
  if (a >= 1e8) return (n / 1e8).toFixed(1).replace(/\.0$/, "") + "億";
  if (a >= 1e4) return (n / 1e4).toFixed(a >= 1e6 ? 0 : 1).replace(/\.0$/, "") + "万";
  return Math.round(n).toLocaleString("ja-JP");
};
const plus = n => n == null ? "—" : (n > 0 ? "+" : "") + num(n);
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem("st:" + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("st:" + k, JSON.stringify(v)); } catch {} },
};
let S = null;
const state = Object.assign({tab: "today", lang: "all", cat: "all", news: "all", csort: "gain", metric: "medianViewsPerDay", bmetric: "medianViewsPerDay"},
                            store.get("state", {}));
const save = () => store.set("state", state);

// ---------- sparkline (single series; tap/hover shows value)
function spark(values, labelFn) {
  const pts = values.map((v, i) => [i, v]).filter(p => p[1] != null);
  if (pts.length < 2) return "";
  const W = 300, H = 44, n = values.length - 1 || 1;
  const ys = pts.map(p => p[1]), lo = Math.min(...ys), hi = Math.max(...ys), span = hi - lo || 1;
  const X = i => i / n * W, Y = v => H - 4 - (v - lo) / span * (H - 10);
  const d = pts.map((p, k) => (k ? "L" : "M") + X(p[0]).toFixed(1) + "," + Y(p[1]).toFixed(1)).join("");
  const last = pts[pts.length - 1];
  const data = esc(JSON.stringify(values));
  return `<div class="spark" data-v="${data}" data-kind="${labelFn}">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="推移">
      <line x1="0" x2="${W}" y1="${H - 1}" y2="${H - 1}" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
      <line class="cx" x1="0" x2="0" y1="0" y2="${H}" stroke="var(--ink3)" stroke-width="1" vector-effect="non-scaling-stroke" opacity="0"/>
    </svg>
    <span class="dot" style="left:${X(last[0]) / W * 100}%;top:${Y(last[1]) / H * 100}%"></span>
    <div class="tip"></div></div>`;
}
function bindSparks(root) {
  root.querySelectorAll(".spark").forEach(el => {
    const vals = JSON.parse(el.dataset.v), tip = $(".tip", el), cx = $(".cx", el), n = vals.length - 1;
    const back = n, kind = el.dataset.kind;
    const show = e => {
      const r = el.getBoundingClientRect(), x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
      let i = Math.round(Math.max(0, Math.min(1, x / r.width)) * n);
      while (i > 0 && vals[i] == null) i--;
      if (vals[i] == null) return;
      const ago = back - i;
      tip.textContent = (ago === 0 ? "今日" : ago + "日前") + "：" + num(vals[i]) + (kind === "subs" ? "人" : "回");
      tip.style.left = (i / n * 100) + "%"; tip.style.display = "block";
      cx.setAttribute("x1", i / n * 300); cx.setAttribute("x2", i / n * 300); cx.setAttribute("opacity", "1");
    };
    const hide = () => { tip.style.display = "none"; cx.setAttribute("opacity", "0"); };
    el.addEventListener("pointermove", show); el.addEventListener("pointerdown", show);
    el.addEventListener("pointerleave", hide);
    el.addEventListener("touchmove", show, {passive: true}); el.addEventListener("touchend", () => setTimeout(hide, 1200));
  });
}

// ---------- filters
function chips(name, opts, cur) {
  return opts.map(([v, l]) => `<button class="chip" data-f="${name}" data-v="${v}" aria-pressed="${v === cur}">${esc(l)}</button>`).join("");
}
function bindFilters(root, rerender) {
  root.querySelectorAll("[data-f]").forEach(b => b.addEventListener("click", () => {
    state[b.dataset.f] = b.dataset.v; save(); rerender();
  }));
  root.querySelectorAll("select[data-s]").forEach(s => s.addEventListener("change", () => {
    state[s.dataset.s] = s.value; save(); rerender();
  }));
}
const langOpts = [["all", "すべて"], ["ja", "日本語"], ["en", "英語"]];
const catLabel = id => S.categoryNames[id] || id;

// ---------- today
function renderToday() {
  const el = $("#tab-today");
  const catOpts = [["all", "全分野"], ...S.categories.filter(c => c.videos).map(c => [c.id, c.name])];
  let vs = S.top.filter(v =>
    (state.lang === "all" || v.lang === state.lang) &&
    (state.cat === "all" || v.categories.includes(state.cat)) &&
    (state.news !== "news" || v.news));
  vs = vs.slice(0, 20);
  const firstDay = S.daysRecorded < 2;
  el.innerHTML = `
    <div class="filters">${chips("lang", langOpts, state.lang)}
      <select class="chip" data-s="cat" aria-label="分野">${catOpts.map(([v, l]) => `<option value="${v}" ${v === state.cat ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>
      ${chips("news", [["all", "すべて"], ["news", "報道特集だけ"]], state.news)}</div>
    ${firstDay ? `<div class="note">記録1日目のため、「24時間の伸び」はまだ出ません。明日から前日比で並びます。今日は投稿からの1日あたり再生数で並べています。</div>` : ""}
    ${vs.length ? vs.map((v, i) => `
      <article class="card">
        <div class="vtop"><div class="rank ${i < 5 ? "hi" : ""}">${i + 1}</div>
          <div style="min-width:0">
            <a class="vtitle" href="https://www.youtube.com/watch?v=${esc(v.id)}" target="_blank" rel="noopener">${esc(v.title)}</a>
            <div class="sub">${esc(v.channel)} ・ ${v.lang === "ja" ? "日本語" : "英語"} ・ 投稿${v.ageDays < 1 ? Math.round(v.ageDays * 24) + "時間" : Math.floor(v.ageDays) + "日"}前 ・ ${Math.round(v.duration / 60)}分</div>
            <div class="tags">${v.news ? `<span class="tag news">報道特集</span>` : ""}${v.categories.map(c => `<span class="tag">${esc(catLabel(c))}</span>`).join("")}</div>
          </div></div>
        <div class="stats">
          <div class="stat"><div class="k">24時間の伸び</div><div class="v ${v.gain24h > 0 ? "up" : ""}">${plus(v.gain24h)}</div></div>
          <div class="stat"><div class="k">総再生</div><div class="v">${num(v.views)}</div></div>
          <div class="stat"><div class="k">登録者比</div><div class="v">${v.viewsPerSub == null ? "—" : v.viewsPerSub + "倍"}</div></div>
        </div>
        ${spark(v.trend, "views")}
      </article>`).join("") : `<div class="empty">条件に合う動画がありません</div>`}`;
  bindFilters(el, renderToday); bindSparks(el);
}

// ---------- channels
function renderChannels() {
  const el = $("#tab-channels");
  const sorts = {gain: ["登録者の増加（7日）", c => c.subsGain7d ?? -Infinity],
                 pct: ["増加率（7日）", c => c.subsGrowth7dPct ?? -Infinity],
                 views: ["再生の増加（7日）", c => c.viewsGain7d ?? -Infinity],
                 subs: ["登録者数", c => c.subs]};
  let cs = S.channels.filter(c => state.lang === "all" || c.lang === state.lang)
    .sort((a, b) => sorts[state.csort][1](b) - sorts[state.csort][1](a)).slice(0, 40);
  const enough = S.daysRecorded >= 8;
  el.innerHTML = `
    <div class="filters">${chips("lang", langOpts, state.lang)}
      <select class="chip" data-s="csort" aria-label="並べ方">${Object.entries(sorts).map(([k, [l]]) => `<option value="${k}" ${k === state.csort ? "selected" : ""}>${l}</option>`).join("")}</select></div>
    ${enough ? "" : `<div class="note">7日間の伸びは、記録が8日分たまると出ます（今 ${S.daysRecorded} 日分）。それまでは記録開始日からの増加を表示します。</div>`}
    ${cs.map((c, i) => {
      const first = c.trend.find(v => v != null), gainSince = first != null ? c.subs - first : null;
      return `<article class="card">
        <div class="ch">${c.thumb ? `<img src="${esc(c.thumb)}" alt="" loading="lazy">` : `<div class="ph"></div>`}
          <div style="min-width:0;flex:1"><a href="https://www.youtube.com/channel/${esc(c.id)}" target="_blank" rel="noopener"><div class="t">${i + 1}. ${esc(c.title)}</div></a>
          <div class="sub">${c.lang === "ja" ? "日本語" : c.lang === "en" ? "英語" : ""} ・ 追跡中の動画 ${c.trackedVideos}本</div></div></div>
        <div class="tags">${c.categories.map(x => `<span class="tag">${esc(catLabel(x))}</span>`).join("")}</div>
        <div class="stats">
          <div class="stat"><div class="k">登録者</div><div class="v">${c.hiddenSubs ? "非公開" : num(c.subs)}</div></div>
          <div class="stat"><div class="k">${enough ? "7日の増加" : "記録開始から"}</div><div class="v ${(enough ? c.subsGain7d : gainSince) > 0 ? "up" : ""}">${plus(enough ? c.subsGain7d : gainSince)}</div></div>
          <div class="stat"><div class="k">増加率(7日)</div><div class="v">${c.subsGrowth7dPct == null ? "—" : c.subsGrowth7dPct + "%"}</div></div>
        </div>
        ${spark(c.trend, "subs")}
      </article>`; }).join("") || `<div class="empty">チャンネルがありません</div>`}`;
  bindFilters(el, renderChannels); bindSparks(el);
}

// ---------- fields
const metrics = {
  medianViewsPerDay: ["1日あたり再生（中央値）", v => num(v) + "回"],
  medianGain24h: ["24時間の伸び（中央値）", v => num(v) + "回"],
  medianViewsPerSub: ["登録者あたり再生（中央値）", v => v == null ? "—" : v.toFixed(2) + "倍"],
  inTop20: ["伸び上位20本に入った本数", v => v + "本"],
};
function renderFields() {
  const el = $("#tab-fields");
  const m = state.metric in metrics ? state.metric : "medianViewsPerDay";
  const cs = S.categories.filter(c => c.videos).slice().sort((a, b) => (b[m] ?? -1) - (a[m] ?? -1));
  const max = Math.max(...cs.map(c => c[m] ?? 0), 1);
  const sel = cs.find(c => c.id === state.fsel) || cs[0];
  el.innerHTML = `
    <div class="filters"><select class="chip" data-s="metric" aria-label="比べる指標">${Object.entries(metrics).map(([k, [l]]) => `<option value="${k}" ${k === m ? "selected" : ""}>${l}</option>`).join("")}</select></div>
    <div class="card">
      <h2>${metrics[m][0]}</h2>
      <div class="bars">${cs.map(c => `
        <div class="row ${sel && c.id === sel.id ? "sel" : ""}" data-id="${c.id}">
          <div class="name">${esc(c.name)}</div>
          <div class="track"><div class="bar" style="width:${(c[m] ?? 0) / max * 66}%"></div>
            <div class="val" style="left:${(c[m] ?? 0) / max * 66}%">${c[m] == null ? "—" : metrics[m][1](c[m])}</div></div>
        </div>`).join("")}</div>
      <div class="sub" style="margin-top:6px">直近${S.trackDays}日以内に投稿された動画で比較。棒をタップすると詳しく見られます。</div>
    </div>
    ${sel ? `<div class="card detail">
      <h2>${esc(sel.name)}</h2>
      <div>動画 <b>${sel.videos}</b>本（${sel.channels}チャンネル）・日本語の割合 <b>${sel.jaShare == null ? "—" : Math.round(sel.jaShare * 100) + "%"}</b></div>
      <div>1日あたり再生の中央値 <b>${num(sel.medianViewsPerDay)}</b>回（ショートを除くと ${num(sel.medianViewsPerDayLong)}回）</div>
      <div>分野全体の24時間の伸び <b>${plus(sel.totalGain24h)}</b>回</div>
      <div style="margin-top:6px;font-size:12px;color:var(--ink3)">分野全体の1日ごとの伸び（過去14日）</div>
      ${spark(sel.daily, "views") || `<div class="sub">記録が2日分たまると表示されます</div>`}
    </div>` : ""}
    <details class="card"><summary>表で見る</summary>
      <table><thead><tr><th>分野</th><th>本数</th><th>1日再生</th><th>24h伸び</th><th>登録者比</th><th>上位20</th></tr></thead>
      <tbody>${cs.map(c => `<tr><td>${esc(c.name)}</td><td>${c.videos}</td><td>${num(c.medianViewsPerDay)}</td><td>${num(c.medianGain24h)}</td><td>${c.medianViewsPerSub == null ? "—" : c.medianViewsPerSub.toFixed(2)}</td><td>${c.inTop20}</td></tr>`).join("")}</tbody></table>
    </details>`;
  bindFilters(el, renderFields); bindSparks(el);
  el.querySelectorAll(".bars .row").forEach(r => r.addEventListener("click", () => { state.fsel = r.dataset.id; save(); renderFields(); }));
}

// ---------- book
function barCard(title, rows, m, note) {
  const max = Math.max(...rows.map(r => r[m] ?? 0), 1);
  return `<div class="card"><h2>${title}</h2><div class="bars">${rows.map(r => `
    <div class="row" style="cursor:default"><div class="name">${esc(r.name)}<br><span style="font-size:11px;color:var(--ink3)">${r.videos}本</span></div>
      <div class="track"><div class="bar" style="width:${(r[m] ?? 0) / max * 66}%"></div>
      <div class="val" style="left:${(r[m] ?? 0) / max * 66}%">${r[m] == null ? "—" : metrics[m][1](r[m])}</div></div></div>`).join("")}</div>
    ${note ? `<div class="sub" style="margin-top:6px">${note}</div>` : ""}</div>`;
}
function renderBook() {
  const el = $("#tab-book"), B = S.book;
  if (!B) { el.innerHTML = `<div class="empty">次回の記録から表示されます</div>`; return; }
  const m = state.bmetric in metrics && state.bmetric !== "inTop20" ? state.bmetric : "medianViewsPerDay";
  const few = B.compare[0].videos < 10;
  el.innerHTML = `
    <p class="lead">あなたの本の書き方に近い動画＝テーマを問わず、一人称の体験談か当事者への密着がある動画です。</p>
    <div class="filters"><select class="chip" data-s="bmetric" aria-label="比べる指標">${Object.entries(metrics).filter(([k]) => k !== "inTop20").map(([k, [l]]) => `<option value="${k}" ${k === m ? "selected" : ""}>${l}</option>`).join("")}</select></div>
    ${few ? `<div class="note">まだ本数が少ないため、比較の数字は参考程度です。記録がたまるほど確かになります。</div>` : ""}
    ${barCard("本に近い動画は伸びやすい？", B.compare, m, "8分野すべての動画で、語り口だけを分けて比べています。")}
    ${barCard("どの要素が効いている？", B.signals, m, "本に近い動画のうち、各要素を持つ動画の数字です（重なりあり）。")}
    ${barCard("全体：語り口ごとの伸びやすさ", S.styles.filter(x => x.videos), m, "8分野すべての動画で比べています。")}
    ${barCard("全体：問いかけ型タイトル", S.question, m, "「なぜ」「〜のか」「Why」などで始まる・含むタイトルとそれ以外。")}
    <h2 style="margin-top:14px">本に近い動画（伸びた順）</h2>
    ${B.videos.length ? B.videos.map((v, i) => `
      <article class="card">
        <div class="vtop"><div class="rank ${i < 5 ? "hi" : ""}">${i + 1}</div>
          <div style="min-width:0">
            <a class="vtitle" href="https://www.youtube.com/watch?v=${esc(v.id)}" target="_blank" rel="noopener">${esc(v.title)}</a>
            <div class="sub">${esc(v.channel)} ・ ${v.lang === "ja" ? "日本語" : "英語"} ・ ${Math.round(v.duration / 60)}分</div>
            <div class="tags">${v.news ? `<span class="tag news">報道特集</span>` : ""}
              ${v.book.firstPerson.length ? `<span class="tag">一人称：${esc(v.book.firstPerson.join("・"))}</span>` : ""}
              ${v.book.case.length ? `<span class="tag">当事者：${esc(v.book.case.join("・"))}</span>` : ""}
              ${v.book.question ? `<span class="tag">問いかけ</span>` : ""}
              ${v.book.explainer ? `<span class="tag">解説・考察</span>` : ""}
              ${v.categories.map(c => `<span class="tag k">${esc(catLabel(c))}</span>`).join("")}</div>
          </div></div>
        <div class="stats">
          <div class="stat"><div class="k">24時間の伸び</div><div class="v ${v.gain24h > 0 ? "up" : ""}">${plus(v.gain24h)}</div></div>
          <div class="stat"><div class="k">1日あたり</div><div class="v">${num(v.viewsPerDay)}</div></div>
          <div class="stat"><div class="k">登録者比</div><div class="v">${v.viewsPerSub == null ? "—" : v.viewsPerSub + "倍"}</div></div>
        </div>
        ${spark(v.trend, "views")}
      </article>`).join("") : `<div class="empty">今日は当てはまる動画がありません</div>`}`;
  bindFilters(el, renderBook); bindSparks(el);
}

// ---------- tabs
const titles = {today: "今日伸びた動画", channels: "チャンネル比較", fields: "分野別の伸びやすさ", book: "本の書き方に近い動画"};
function show(tab) {
  state.tab = tab; save();
  document.querySelectorAll("nav button").forEach(b => b.dataset.tab === tab ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  Object.keys(titles).forEach(t => $("#tab-" + t).hidden = t !== tab);
  $("#htitle").textContent = titles[tab];
  ({today: renderToday, channels: renderChannels, fields: renderFields, book: renderBook})[tab]();
  window.scrollTo(0, 0);
}
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => show(b.dataset.tab)));

fetch("data/summary.json?t=" + Date.now()).then(r => r.json()).then(s => {
  S = s;
  const u = new Date(s.updatedAt);
  $("#meta").textContent = `更新 ${u.getMonth() + 1}/${u.getDate()} ${String(u.getHours()).padStart(2, "0")}:${String(u.getMinutes()).padStart(2, "0")} ・ 記録${s.daysRecorded}日分 ・ 動画${s.counts.videos}本 / ${s.counts.channels}チャンネル` +
    (s.excluded ? ` ・ 除外 ショート${s.excluded.short || 0}・煽り${s.excluded.sensational || 0}` : "");
  show(state.tab in titles ? state.tab : "today");
}).catch(() => { $("#meta").textContent = "データを読み込めませんでした。最初の自動実行のあとに表示されます。"; });
</script>
</body>
</html>
